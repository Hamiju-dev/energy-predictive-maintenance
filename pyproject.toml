[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predmaint"
version = "0.1.0"
description = "Early fault detection for wind turbines from SCADA data (normal-behaviour models + residual alarms)"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
predmaint = "predmaint.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
